[package]
name = "campus_agora_api"
version = "0.1.0"
# The crate also ships the `export-openapi` tool, so the documented
# `cargo run -p campus_agora_api` needs an unambiguous default.
default-run = "campus-agora-api"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum.workspace = true
campus_agora_application = { path = "../application" }
campus_agora_db = { path = "../db" }
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
serde_json.workspace = true
tower.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "campus-agora-api"
path = "src/main.rs"
